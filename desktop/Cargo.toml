[package]
name = "angar"
version = "0.4.0"
edition = "2021"
description = "angar - AI usage for your company"
authors = ["angar"]
build = "build.rs"
license = "Proprietary"

[[bin]]
name = "angar"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Windows: native APIs instead of child processes (reg.exe, PowerShell, whoami),
# so the app doesn't look like a script dropper to antivirus heuristics.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security_Authentication_Identity", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"
