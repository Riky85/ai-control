name: angar Edge

# Builds the angar Edge network sensor (edge/) as static musl binaries for
# Linux x86_64 and aarch64, publishes them to the "edge-latest" release (used by
# edge/install.sh) and pushes a multi-arch image to ghcr.io/riky85/angar-edge.
on:
  push:
    branches: [main]
    paths: ["edge/**", ".github/workflows/edge.yml", "src/lib/edge/install-script.ts"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge
      - name: Test
        run: cargo test --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer served by the web app matches edge/install.sh
        working-directory: .
        run: |
          node --experimental-strip-types -e '
            const fs = require("node:fs");
            import("./src/lib/edge/install-script.ts").then((m) => {
              if (m.EDGE_INSTALL_SCRIPT !== fs.readFileSync("edge/install.sh", "utf8")) {
                console.error("src/lib/edge/install-script.ts is out of sync with edge/install.sh");
                process.exit(1);
              }
            });'
      - name: Shell syntax
        run: |
          sh -n install.sh
          sh -n hardware/provision.sh
          sh -n hardware/led-pi5.sh
          bash -n hardware/build-image.sh
      - name: Shellcheck
        run: shellcheck -S warning install.sh hardware/*.sh

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: angar-edge-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: angar-edge-linux-aarch64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge
          key: ${{ matrix.target }}
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (static)
        env:
          # ring's C/asm parts: use musl-gcc (Ubuntu's musl-tools has no <arch>-linux-musl-gcc)
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/angar-edge dist/${{ matrix.asset }}
          file dist/${{ matrix.asset }}
          ./dist/${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: edge/dist/${{ matrix.asset }}

  # Windows: per provare Edge sul proprio PC (DNS per quel PC o per la rete, niente aggiornamenti automatici).
  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge
          key: windows
      - name: Build
        run: |
          cargo build --release
          mkdir -p dist
          cp target/release/angar-edge.exe dist/angar-edge-windows-x64.exe
          ./dist/angar-edge-windows-x64.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: angar-edge-windows-x64.exe
          path: edge/dist/angar-edge-windows-x64.exe

  release:
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: edge/Cargo.toml
      # Solo i binari: build-push-action carica anche un "build record" Docker che non va scaricato qui.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: angar-edge-*
          merge-multiple: true
      # Devices only install binaries whose ed25519 signature matches the public key built
      # into angar-edge (EDGE_UPDATE_PUBKEY in edge/src/update.rs). The private key is the
      # EDGE_SIGNING_KEY secret: base64 of the raw 32-byte ed25519 seed.
      - name: Sign binaries (ed25519)
        env:
          EDGE_SIGNING_KEY: ${{ secrets.EDGE_SIGNING_KEY }}
        run: |
          if [ -z "$EDGE_SIGNING_KEY" ]; then
            echo "::warning title=angar Edge::EDGE_SIGNING_KEY is not set: publishing WITHOUT .sig files, devices will refuse this update"
            exit 0
          fi
          python3 -c 'import cryptography' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography; }
          python3 - <<'EOF'
          import base64, glob, os, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          seed = base64.b64decode(os.environ["EDGE_SIGNING_KEY"].strip())
          if len(seed) != 32:
              sys.exit("EDGE_SIGNING_KEY must be base64 of a 32-byte ed25519 seed")
          key = Ed25519PrivateKey.from_private_bytes(seed)
          pub = base64.b64encode(key.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw)).decode()
          print("public key:", pub)
          if pub != "T6vTxDdHRBSWI52KNuPmzd+P/w5v1yXHBDhDSM14VVg=":
              sys.exit("EDGE_SIGNING_KEY does not match EDGE_UPDATE_PUBKEY in edge/src/update.rs")
          for path in sorted(glob.glob("dist/angar-edge-linux-*")):
              if path.endswith(".sig"):
                  continue
              data = open(path, "rb").read()
              sig = key.sign(data)
              key.public_key().verify(sig, data)
              open(path + ".sig", "w").write(base64.b64encode(sig).decode() + "\n")
              print("signed", path, len(data), "bytes")
          EOF
      # SHA256SUMS: edge/install.sh checks the downloaded binary against it.
      - name: Checksums
        run: |
          (cd dist && sha256sum angar-edge-linux-x86_64 angar-edge-linux-aarch64 angar-edge-windows-x64.exe > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Version file
        run: |
          sed -n 's/^version = "\(.*\)"/\1/p' edge/Cargo.toml | head -n 1 > dist/angar-edge-version.txt
          test -s dist/angar-edge-version.txt
          cat dist/angar-edge-version.txt
      - name: Publish to the edge-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release view edge-latest >/dev/null 2>&1 || gh release create edge-latest --title "angar Edge sensor" --notes "Built automatically from edge/. Install it from your angar workspace (Edge → Sensors), not from here." --latest=false --target "$GITHUB_SHA"
          # stale signatures must not survive an unsigned build
          if ! ls dist/*.sig >/dev/null 2>&1; then
            for a in angar-edge-linux-x86_64.sig angar-edge-linux-aarch64.sig; do gh release delete-asset edge-latest "$a" --yes 2>/dev/null || true; done
          fi
          # binaries, signatures and checksums first, the version file last: devices read it to decide
          gh release upload edge-latest dist/angar-edge-linux-* dist/angar-edge-windows-x64.exe dist/SHA256SUMS --clobber
          gh release upload edge-latest dist/angar-edge-version.txt --clobber

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Arrange binaries per Docker platform
        run: |
          mkdir -p ctx/amd64 ctx/arm64
          cp dist/angar-edge-linux-x86_64 ctx/amd64/angar-edge
          cp dist/angar-edge-linux-aarch64 ctx/arm64/angar-edge
          chmod 0755 ctx/*/angar-edge
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          file: edge/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/riky85/angar-edge:latest
            ghcr.io/riky85/angar-edge:${{ github.sha }}
