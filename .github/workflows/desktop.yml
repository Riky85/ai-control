name: Desktop app

# Builds the angar desktop agent for Windows, macOS (Intel + Apple Silicon)
# and Linux, and publishes it to the "desktop-latest" release. The web app
# downloads it from there and names it after each company's link.
#
# Code signing is optional and driven by repository secrets (see docs/code-signing.md).
# Without them the build is published unsigned, exactly as before, with a warning.
# The web app never changes the bytes of the .exe or the Linux binary (it only
# renames the download), and for macOS it only renames the angar.app folder
# inside the zip, so the signatures stay valid.
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: angar-windows-x64.exe
          - os: macos-latest
            asset: angar-macos-universal
          - os: ubuntu-22.04
            asset: angar-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Test
        run: cargo test --release

      # ---------------------------------------------------------------- Windows
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo build --release
          mkdir -p dist && cp target/release/angar.exe dist/${{ matrix.asset }}
      # Which signing method is configured? (secrets can't be used in `if:` directly)
      - name: Windows signing method
        id: winsign
        if: matrix.os == 'windows-latest'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] \
             && [ -n "$TRUSTED_SIGNING_ACCOUNT" ] && [ -n "$TRUSTED_SIGNING_PROFILE" ] && [ -n "$TRUSTED_SIGNING_ENDPOINT" ]; then
            echo "method=azure" >> "$GITHUB_OUTPUT"
            echo "Windows: signing with Azure Artifact Signing (Trusted Signing)"
          elif [ -n "$WINDOWS_CERT_PFX_BASE64" ]; then
            echo "method=pfx" >> "$GITHUB_OUTPUT"
            echo "Windows: signing with the PFX certificate"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::warning title=Windows not signed::No Azure Artifact Signing or WINDOWS_CERT_PFX_BASE64 secrets: publishing an UNSIGNED .exe (SmartScreen/Intune may block it). See docs/code-signing.md"
          fi
      - name: Sign (Windows, Azure Artifact Signing)
        if: matrix.os == 'windows-latest' && steps.winsign.outputs.method == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\desktop\dist\${{ matrix.asset }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: angar
      - name: Sign (Windows, PFX certificate)
        if: matrix.os == 'windows-latest' && steps.winsign.outputs.method == 'pfx'
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          SIGNTOOL="$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64/signtool.exe | sort -V | tail -n 1)"
          [ -x "$SIGNTOOL" ] || { echo "::error::signtool.exe not found"; exit 1; }
          PFX="$RUNNER_TEMP/angar-codesign.pfx"
          printf '%s' "$WINDOWS_CERT_PFX_BASE64" | base64 -d > "$PFX"
          trap 'rm -f "$PFX"' EXIT
          # RFC 3161 timestamp: the signature stays valid after the certificate expires.
          ok=""
          for ts in http://timestamp.digicert.com http://timestamp.sectigo.com http://time.certum.pl; do
            if "$SIGNTOOL" sign /f "$PFX" /p "$WINDOWS_CERT_PASSWORD" /fd sha256 /tr "$ts" /td sha256 \
                 /d angar "dist/${{ matrix.asset }}"; then ok=1; break; fi
            echo "timestamp server $ts failed, trying the next one"; sleep 5
          done
          [ -n "$ok" ] || { echo "::error::signing failed"; exit 1; }
      - name: Verify signature (Windows)
        if: matrix.os == 'windows-latest' && steps.winsign.outputs.method != 'none'
        run: |
          SIGNTOOL="$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64/signtool.exe | sort -V | tail -n 1)"
          "$SIGNTOOL" verify /pa /v "dist/${{ matrix.asset }}"
          # A renamed copy (what the web app serves) must verify too: the name isn't signed.
          cp "dist/${{ matrix.asset }}" "$RUNNER_TEMP/angar-TESTCODE123.exe"
          "$SIGNTOOL" verify /pa "$RUNNER_TEMP/angar-TESTCODE123.exe"

      # ------------------------------------------------------------------ macOS
      # Two assets: angar-macos-universal (bare binary, ad-hoc signed, as before: older
      # web app versions wrap it in a .app themselves) and angar-macos.app.zip (the
      # finished bundle, Developer ID signed + notarised + stapled when secrets exist).
      - name: Build (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/${{ matrix.asset }} target/aarch64-apple-darwin/release/angar target/x86_64-apple-darwin/release/angar
          codesign --force --sign - dist/${{ matrix.asset }}
      - name: Assemble angar.app (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$VERSION"
          APP=build/angar.app
          rm -rf build && mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/${{ matrix.asset }} "$APP/Contents/MacOS/angar"
          chmod 0755 "$APP/Contents/MacOS/angar"
          sed "s/__VERSION__/$VERSION/g" assets/Info.plist > "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          # Icon from assets/angar.png (256x256)
          ICONSET=build/angar.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256; do
            sips -z $s $s assets/angar.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
          done
          sips -z 32 32 assets/angar.png --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 64 64 assets/angar.png --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 256 256 assets/angar.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/angar.icns" \
            || echo "::warning::could not build angar.icns, the app will use the generic icon"
      - name: macOS signing method
        id: macsign
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "sign=false" >> "$GITHUB_OUTPUT"; echo "notarize=none" >> "$GITHUB_OUTPUT"
            echo "::warning title=macOS not signed::No MACOS_CERT_P12_BASE64 secret: publishing an ad-hoc signed app (Gatekeeper will block it). See docs/code-signing.md"
            exit 0
          fi
          echo "sign=true" >> "$GITHUB_OUTPUT"
          if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "notarize=apikey" >> "$GITHUB_OUTPUT"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "notarize=appleid" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=none" >> "$GITHUB_OUTPUT"
            echo "::warning title=macOS not notarised::Signed with Developer ID but no notarisation credentials (APPLE_API_KEY_* or APPLE_ID/APPLE_TEAM_ID/APPLE_APP_PASSWORD): Gatekeeper will still block downloads. See docs/code-signing.md"
          fi
      - name: Sign angar.app (macOS, Developer ID)
        if: matrix.os == 'macos-latest' && steps.macsign.outputs.sign == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/angar-signing.keychain-db"
          KC_PW="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/angar-cert.p12"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$P12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk '/Developer ID Application/ {print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "::error::no 'Developer ID Application' identity in MACOS_CERT_P12_BASE64"; security find-identity -v -p codesigning "$KC"; exit 1; }
          # Hardened runtime + secure timestamp (both required for notarisation). No
          # entitlements: the app is a plain network client (no JIT, no unsigned plug-ins).
          codesign --force --options runtime --timestamp --keychain "$KC" --sign "$IDENTITY" build/angar.app
          codesign --verify --deep --strict --verbose=2 build/angar.app
          codesign -dv --verbose=2 build/angar.app
      - name: Notarise and staple angar.app (macOS)
        if: matrix.os == 'macos-latest' && steps.macsign.outputs.notarize != 'none'
        env:
          METHOD: ${{ steps.macsign.outputs.notarize }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          SUBMIT="$RUNNER_TEMP/angar-notarize.zip"
          ditto -c -k --keepParent build/angar.app "$SUBMIT"
          if [ "$METHOD" = "apikey" ]; then
            KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY"
            AUTH=(--key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          else
            AUTH=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD")
          fi
          OUT="$(xcrun notarytool submit "$SUBMIT" "${AUTH[@]}" --wait --timeout 30m --output-format json)" || true
          echo "$OUT"
          ID="$(printf '%s' "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)"
          STATUS="$(printf '%s' "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"
          if [ "$STATUS" != "Accepted" ]; then
            [ -z "$ID" ] || xcrun notarytool log "$ID" "${AUTH[@]}" || true
            rm -f "${KEY:-}"
            echo "::error::notarisation failed (status: ${STATUS:-unknown})"; exit 1
          fi
          rm -f "${KEY:-}"
          xcrun stapler staple build/angar.app
          xcrun stapler validate build/angar.app
          spctl -a -vv -t exec build/angar.app
      - name: Ad-hoc sign angar.app (macOS, no Developer ID)
        if: matrix.os == 'macos-latest' && steps.macsign.outputs.sign != 'true'
        run: codesign --force --sign - build/angar.app
      - name: Zip angar.app (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # No resource forks / extended attributes: the signature and the stapled ticket
          # live in regular files (Contents/_CodeSignature, Contents/CodeResources).
          ditto -c -k --norsrc --noextattr --keepParent build/angar.app dist/angar-macos.app.zip
          # The web app renames angar.app to angar-<code>.app: check that still verifies.
          rm -rf "$RUNNER_TEMP/rename" && mkdir -p "$RUNNER_TEMP/rename"
          ditto -x -k dist/angar-macos.app.zip "$RUNNER_TEMP/rename"
          mv "$RUNNER_TEMP/rename/angar.app" "$RUNNER_TEMP/rename/angar-TESTCODE123.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/rename/angar-TESTCODE123.app"
          unzip -l dist/angar-macos.app.zip
      - name: Remove temporary keychain (macOS)
        if: always() && matrix.os == 'macos-latest'
        run: security delete-keychain "$RUNNER_TEMP/angar-signing.keychain-db" 2>/dev/null || true

      # ------------------------------------------------------------------ Linux
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo build --release
          mkdir -p dist && cp target/release/angar dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: desktop/dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          (cd dist && sha256sum angar-* > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Publish to the desktop-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --title "angar desktop app" --notes "Built automatically from desktop/. Download it from your angar workspace (Sources → Desktop app), not from here." --latest=false --target "$GITHUB_SHA"
          gh release upload desktop-latest dist/* --clobber
