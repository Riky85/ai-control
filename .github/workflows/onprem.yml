name: angar on-premises

# Builds the angar web app image for the on-premises edition (onprem/Dockerfile)
# on native amd64 and arm64 runners and publishes ghcr.io/riky85/angar:latest
# (multi-arch). The installer is onprem/install.sh, served at /api/onprem/install.sh.
on:
  push:
    branches: [main]
    paths-ignore: ["desktop/**", "edge/**", "docs/**", ".github/workflows/desktop.yml", ".github/workflows/edge.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: onprem-image
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer
        run: |
          sh -n onprem/install.sh
          shellcheck -S warning onprem/install.sh

  image:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: onprem/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          build-args: ANGAR_VERSION=${{ github.sha }}
          tags: ghcr.io/riky85/angar:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=onprem-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=onprem-${{ matrix.arch }}

  manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch tag
        run: |
          docker buildx imagetools create \
            -t ghcr.io/riky85/angar:latest \
            -t ghcr.io/riky85/angar:${{ github.sha }} \
            ghcr.io/riky85/angar:latest-amd64 ghcr.io/riky85/angar:latest-arm64
